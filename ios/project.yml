# Generate the Xcode project with:  xcodegen
# (install once with:  brew install xcodegen)
name: BabyCam
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  BabyCam:
    type: application
    platform: iOS
    sources:
      - path: BabyCam
    settings:
      base:
        # Change this to something unique to you, e.g. com.yourname.babycam
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.babycam
        PRODUCT_NAME: BabyCam
        INFOPLIST_FILE: BabyCam/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        CODE_SIGN_STYLE: Automatic
        # Pick your team in Xcode > Signing & Capabilities (or paste your Team ID here)
        DEVELOPMENT_TEAM: ""
